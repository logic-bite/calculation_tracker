# Save this file as: .github/workflows/keepalive.yml  in your GitHub repo
# It pings your Supabase project every few days so the free tier doesn't
# auto-pause it from inactivity (pauses after 7 days with no activity).
name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 12 */5 * *'   # every 5 days at 12:00 UTC
  workflow_dispatch:          # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://https://ffulfucazvgmhvvprquf.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_MeZQQaleGFcC32PW-7JmvQ_5-N1pelP"
